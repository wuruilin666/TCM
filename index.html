    <style>

        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body::after { content: ''; position: fixed; bottom: -80px; left: -100px; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(139,69,19,0.06); pointer-events: none; z-index: 0; }
        .app-container { width: 100%; max-width: 720px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 0; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(30,15,5,0.55); z-index: 1000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.25s; padding: 20px; }

<body>

<header class="site-header">
    <nav class="top-nav" id="topNav">
        <span class="nav-link nav-active" id="navHome" onclick="goHome()">🏠 首页</span>
        <span class="nav-link" id="navGame" onclick="startChallenge()">🎯 闯关</span>
        <span class="nav-link" id="navAbout" onclick="showAbout()">📖 关于</span>
    </nav>
</header>

<main class="app-container" id="appContainer">
    <div id="loadingIndicator" style="text-align:center;padding:40px;">
        <div style="font-size:1.2em;color:var(--text-muted);">📚 病例数据加载中...</div>
    </div>
</main>

<footer class="site-footer">
    <div class="copyright">© wuruilin</div>
</footer>

<!-- 模态框 -->
<div class="modal-overlay" id="inquiryModal" style="display:none;">
    <div class="modal" style="max-width:600px;">
        <button class="modal-close" onclick="closeInquiryModal()">✕</button>
        <h3>💬 问诊 — 请向患者提问</h3>
        <div class="chat-area" id="inquiryChatArea"></div>
        <div class="chat-input-area">
            <input type="text" id="inquiryInput" placeholder="输入您想问的问题..." onkeydown="if(event.key==='Enter')sendInquiry()">
            <button onclick="sendInquiry()">发送</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="inspectionModal" style="display:none;">
    <div class="modal" style="max-width:720px;">
        <button class="modal-close" onclick="closeInspectionModal()">✕</button>

            <div style="display:flex;align-items:center;justify-content:center;gap:14px;">

                <div class="tongue-img-wrap">
                    <span class="tongue-badge" id="tongueImageBadge">参考图</span>

            <div id="inspectionCounter" style="text-align:center;color:var(--text-muted);font-size:0.85em;min-height:1em;"></div>
        </div>
        <div id="inspectionNonTongue" style="background:#fdfaf5;border:1px dashed var(--border);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:0.9em;color:var(--text-light);display:none;"></div>
        <div class="card" style="margin-top:8px;padding:14px 16px;">
            <div style="font-weight:700;color:var(--primary);margin-bottom:8px;">🔍 判断舌象</div>

<script>

        'inter-002': '参考图', 'inter-003': '参考图', 'adv-001': '参考图'

    const genericAnswers = ["这个没什么特别的。","还好，没太注意。","有时有，有时没有。","和之前差不多。","好像没什么影响。","没感觉到什么异常。","就这样，老样子。","记不太清了。"];
    let currentDifficulty = null;
    let currentCase = null;
    let collectedClues = [];
    let exploredDiags = {};
    let gameStarted = false;
    let inquiryHistory = [];
    let askedInquiryQuestions = [];
    let unfinishedCases = [];
    let currentCaseIndex = 0;
    let inspectionImages = [];
    let inspectionIndex = 0;
    let inspectionNonTongueAdded = false;
    let lastAnswerWasCorrect = false;

    /* ===================== 数据加载 ===================== */
    async function loadCaseData() {
        try {
            const response = await fetch('cases.json');
            if (!response.ok) throw new Error('病例数据加载失败');
            casesDB = await response.json();
            document.getElementById('loadingIndicator').style.display = 'none';
            initApp();
        } catch (error) {
            console.error('加载病例数据出错:', error);
            document.getElementById('loadingIndicator').innerHTML = '<div style="font-size:1.2em;color:var(--accent);">❌ 病例数据加载失败，请刷新重试</div>';
        }
    }

    function initApp() {
        const appContainer = document.getElementById('appContainer');
        appContainer.innerHTML = `
            <div class="page active" id="pageHome">
                <div class="card card--accent" style="text-align:center;">

                <div class="home-buttons">

                        <button class="btn btn--outline btn--equal" onclick="openSubmissionModal()" style="border-color: var(--gold); color: var(--gold);">📤 投稿病例</button>

                        <button class="btn btn--difficulty btn--intermediate" data-diff="intermediate" onclick="selectDifficulty('intermediate', this)">🌿 综合训练</button>
                        <button class="btn btn--difficulty btn--advanced" data-diff="advanced" onclick="selectDifficulty('advanced', this)">🌳 临床思维</button>
                    </div>
                </div>
                <div class="card card--highlight" id="chiefComplaintCard" style="display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                        <div style="font-weight:700;color:var(--accent);">🩺 病例主诉（谜面）</div>
                        <button class="btn btn--outline" id="historyBtn" style="display:none;padding:8px 16px;font-size:0.85em;" onclick="showHistory()">📜 病史</button>
                    </div>
                    <div id="chiefComplaintText" style="margin-top:8px;"></div>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;">
                        <button class="btn btn--outline" id="prevCaseBtn" onclick="prevCase()" style="display:none;padding:8px 12px;font-size:0.9em;">‹ 上一例</button>
                        <span id="caseCounter" style="font-weight:600;color:var(--text-light);"></span>

                </div>

                    <button class="btn btn--diag" id="btnWang" onclick="exploreDiag('inspection')"><span class="diag-icon">👁️</span><span class="diag-label">望 诊</span></button>

                <button class="btn btn--outline" id="btnOtherCheck" onclick="showOtherCheck()" style="display:none; margin-top:10px; width:100%;">📋 其他检查</button>
                <div class="card" id="clueCollectionCard" style="display:none;">
                    <div style="font-weight:700;color:var(--text-light);">📋 线索收集区</div>
                    <div class="clue-area" id="clueArea"></div>
                </div>
                <div class="card" id="answerCard" style="display:none;">
                    <div style="font-weight:700;color:var(--text-light);">✍️ 提交辨证</div>
                    <div class="answer-area">
                        <input type="text" id="inputSyndrome" placeholder="证型">
                        <input type="text" id="inputDisease" placeholder="病名">
                    </div>
                    <div style="margin-top:12px;">
                        <label style="font-weight:700;color:var(--text-light);font-size:0.9em;">请写出你的辩证依据 <span class="required-star">*</span></label>
                        <textarea id="inputBasis" placeholder="请写出你的辩证依据（病机分析、辨证思路等）" style="width:100%;min-height:100px;margin-top:6px;padding:10px 14px;border-radius:10px;border:2px solid var(--border);font-size:0.95em;background:#fffefb;outline:none;resize:vertical;font-family:var(--font-body);"></textarea>
                    </div>
                    <button class="btn btn--primary" style="width:100%;margin-top:12px;padding:14px 22px;font-size:1em;animation:none;" onclick="submitAnswer()">提交答案</button>
                    <div id="answerFeedback"></div>
                    <div id="fullAnalysisArea"></div>
                </div>
                <div style="display:flex;gap:10px;justify-content:center;" id="gameExtraBtns">
                    <button class="btn btn--outline" onclick="resetCurrentCase()">🔄 重新探查</button>
                    <button class="btn btn--ghost" onclick="goHome()">🏠 返回首页</button>
                </div>
            </div>
            <div class="page" id="pageAbout">
                <div class="card card--gold" style="text-align:center;">
                    <div style="font-size:1.6em;color:var(--primary);">📖 关于本站</div>
                    <div style="margin-top:16px;line-height:1.8;color:var(--text-light);">
                        <strong>中医辨证推演馆</strong> 是一款中医趣味学习工具。<br><br>
                        灵感来源于「海龟汤」解谜游戏，仅给出<strong>病例主诉</strong>，学习者需主动运用望闻问切，逐步收集线索，推理证型与病名。<br>
                        适合中医备考、记忆辨证思路。<br><br>

                <div style="text-align:center;"><button class="btn btn--outline" onclick="goHome()">🏠 返回首页</button></div>

        showPage('Home');

    /* ===================== 存储工具 ===================== */
    function safeGetStorage(key, fallback) { try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : fallback; } catch (e) { return fallback; } }
    function safeSetStorage(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
    function getCompletedCases() { return safeGetStorage('tcm_completed_cases', []); }
    function markCaseCompleted(caseId) {
        const arr = getCompletedCases();
        if (!arr.includes(caseId)) { arr.push(caseId); safeSetStorage('tcm_completed_cases', arr); }
    }
    function getWrongCases() { return safeGetStorage('tcm_wrong_cases', []); }
    function saveWrongCase(data) {
        if (!currentCase) return;
        const wrongs = getWrongCases().filter(w => w.id !== currentCase.id);
        wrongs.push({
            id: currentCase.id,
            title: currentCase.title,
            chiefComplaint: currentCase.chiefComplaint,
            difficulty: currentDifficulty,
            date: new Date().toISOString(),
            syndrome: data.syndrome,
            disease: data.disease,
            basis: data.basis
        });
        safeSetStorage('tcm_wrong_cases', wrongs);
    }
    function removeWrongCase(caseId) {
        safeSetStorage('tcm_wrong_cases', getWrongCases().filter(w => w.id !== caseId));
    }
    function formatDate(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return '';
        const p = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    /* ===================== 页面导航 ===================== */
    function showPage(name) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + name)?.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.querySelectorAll('.top-nav .nav-link').forEach(l => l.classList.remove('nav-active'));
        const map = { Home: 'navHome', Game: 'navGame', About: 'navAbout' };
        document.getElementById(map[name])?.classList.add('nav-active');
    }
    function goHome() { showPage('Home'); }
    function startChallenge() { showPage('Game'); resetGameUI(); }
    function showAbout() { showPage('About'); }

    /* ===================== 闯关逻辑 ===================== */
    function resetGameUI() {
        currentDifficulty = null; currentCase = null; collectedClues = []; exploredDiags = {}; gameStarted = false;
        inquiryHistory = []; askedInquiryQuestions = []; unfinishedCases = []; currentCaseIndex = 0; inspectionNonTongueAdded = false; lastAnswerWasCorrect = false;
        document.getElementById('chiefComplaintCard').style.display = 'none';
        document.getElementById('fourDiagBtns').style.display = 'none';
        document.getElementById('btnOtherCheck').style.display = 'none';
        document.getElementById('clueCollectionCard').style.display = 'none';
        document.getElementById('answerCard').style.display = 'none';
        document.getElementById('gameExtraBtns').style.display = 'none';
        document.getElementById('historyBtn').style.display = 'none';
        document.getElementById('clueArea').innerHTML = '';
        document.getElementById('answerFeedback').innerHTML = '';
        document.getElementById('fullAnalysisArea').innerHTML = '';
        document.getElementById('inputSyndrome').value = '';
        document.getElementById('inputDisease').value = '';
        document.getElementById('inputBasis').value = '';
        document.querySelectorAll('#difficultyBtns .btn--difficulty').forEach(b => b.classList.remove('selected'));
        ['btnWang','btnWen','btnAsk','btnPulse'].forEach(id => document.getElementById(id)?.classList.remove('explored'));
    }

    function selectDifficulty(diff, btnEl) {
        document.querySelectorAll('#difficultyBtns .btn--difficulty').forEach(b => b.classList.remove('selected'));
        btnEl.classList.add('selected');
        currentDifficulty = diff;
        const pool = casesDB[diff];
        if (!pool || pool.length === 0) { alert('该难度暂无病例。'); return; }
        const completed = getCompletedCases();
        unfinishedCases = pool.filter(c => !completed.includes(c.id));
        if (unfinishedCases.length === 0) {
            openSimpleResultModal('🎉 闯关完毕', '该难度下所有病例均已完成，无新病例可学习。您可以在病例题库中复习已完成的病例。');
            document.querySelectorAll('#difficultyBtns .btn--difficulty').forEach(b => b.classList.remove('selected'));
            currentDifficulty = null;
            return;
        }
        currentCaseIndex = 0;
        showCurrentCase();
    }

    function showCurrentCase() {
        if (!unfinishedCases.length) return;
        currentCase = unfinishedCases[currentCaseIndex];
        collectedClues = []; exploredDiags = { inspection: false, auscultation: false, inquiry: false, pulse: false };
        inquiryHistory = []; askedInquiryQuestions = []; gameStarted = true; inspectionNonTongueAdded = false; lastAnswerWasCorrect = false;
        document.getElementById('chiefComplaintCard').style.display = 'block';
        document.getElementById('chiefComplaintText').textContent = currentCase.chiefComplaint;
        document.getElementById('historyBtn').style.display = 'inline-flex';
        document.getElementById('fourDiagBtns').style.display = 'grid';
        document.getElementById('clueCollectionCard').style.display = 'block';
        document.getElementById('answerCard').style.display = 'block';
        document.getElementById('gameExtraBtns').style.display = 'flex';
        document.getElementById('clueArea').innerHTML = '';
        document.getElementById('answerFeedback').innerHTML = '';
        document.getElementById('fullAnalysisArea').innerHTML = '';
        document.getElementById('inputSyndrome').value = '';
        document.getElementById('inputDisease').value = '';
        document.getElementById('inputBasis').value = '';
        ['btnWang','btnWen','btnAsk','btnPulse'].forEach(id => document.getElementById(id)?.classList.remove('explored'));
        document.getElementById('caseCounter').textContent = `病例 ${currentCaseIndex + 1} / ${unfinishedCases.length}`;
        document.getElementById('prevCaseBtn').style.display = (unfinishedCases.length > 1 && currentCaseIndex > 0) ? 'inline-flex' : 'none';
        document.getElementById('nextCaseBtn').style.display = (unfinishedCases.length > 1 && currentCaseIndex < unfinishedCases.length - 1) ? 'inline-flex' : 'none';
        const otherCheckBtn = document.getElementById('btnOtherCheck');
        otherCheckBtn.style.display = (currentDifficulty === 'basic') ? 'none' : 'block';
        document.getElementById('chiefComplaintCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function prevCase() {
        if (currentCaseIndex > 0) { currentCaseIndex--; showCurrentCase(); }
    }
    function nextCase() {
        if (currentCaseIndex < unfinishedCases.length - 1) { currentCaseIndex++; showCurrentCase(); }
    }

    /* ===================== 四诊探索 ===================== */
    function exploreDiag(type) {
        if (!gameStarted || !currentCase) { alert('请先选择难度。'); return; }
        if (type === 'inquiry') { openInquiryModal(); return; }
        if (type === 'inspection') { openInspectionModal(); return; }
        if (exploredDiags[type]) { alert('该诊法已探索过。'); return; }
        exploredDiags[type] = true; markExplored(type);
        const clue = currentCase.clues[type];
        if (clue) { openSimpleResultModal(clue.displayTitle, clue.displayContent); addClue(type, clue.textSummary); }
    }

        inquiryHistory.push({ role: 'user', text: q }); appendChat('user', q);
        input.value = '';
        const questions = currentCase.clues.inquiry.questions;
        let matched = -1;
        for (let i = 0; i < questions.length; i++) {
            if (questions[i].keywords.some(k => q.includes(k))) { matched = i; break; }
        }
        let answer = '';
        if (matched >= 0) {
            answer = questions[matched].a;
            if (!askedInquiryQuestions.includes(matched)) {
                askedInquiryQuestions.push(matched);
                addClue('inquiry', answer, '问诊·' + questions[matched].q);
            } else { answer += '（这个问题刚才已经回答过了）'; }
        } else { answer = genericAnswers[Math.floor(Math.random() * genericAnswers.length)]; }
        setTimeout(() => {
            inquiryHistory.push({ role: 'patient', text: answer }); appendChat('patient', answer);
            if (askedInquiryQuestions.length >= questions.length) { exploredDiags.inquiry = true; markExplored('inquiry'); }
        }, 300);

    function submitTongueJudgment() {
        if (!currentCase) return;
        const userText = document.getElementById('tongueJudgmentInput').value.trim();
        if (!userText) { alert('请填写你的舌象判断。'); return; }
        const tj = currentCase.clues.inspection.tongueJudgment || {};
        const ok = judgeTongueField(userText, tj);
        const correctText = `舌色${tj.color || '未述'}，舌形${tj.shape || '未述'}，舌苔${tj.coating || '未述'}`;
        const html = `<strong>舌象判断</strong><br>${ok ? '✅' : '❌'} 你的描述：${userText}<br><span style="color:var(--text-muted);font-size:0.9em;">正确答案：${correctText}</span>`;
        addClue('inspection', html, '望诊·舌象');
        exploredDiags.inspection = true;
        markExplored('inspection');
        closeInspectionModal();
    }
    function judgeTongueField(userText, tj) {
        if (!userText || !tj) return false;
        const u = userText.replace(/\s+/g, '');
        const colorOk = /正常|无异常|无明显异常|未见异常|无特殊/.test(tj.color || '') ? /正常|无异常|无明显异常|未见异常|无特殊/.test(u) : matchTerm(u, tj.color);
        const shapeOk = /正常|无异常|无明显异常|未见异常|无特殊/.test(tj.shape || '') ? /正常|无异常|无明显异常|未见异常|无特殊/.test(u) : matchTerm(u, tj.shape);
        const coatingOk = /正常|无异常|无明显异常|未见异常|无特殊/.test(tj.coating || '') ? /正常|无异常|无明显异常|未见异常|无特殊/.test(u) : matchTerm(u, tj.coating);
        return (colorOk || shapeOk || coatingOk) && (colorOk + shapeOk + coatingOk >= 2);
    }
    function matchTerm(u, correctVal) {
        if (!correctVal) return false;
        const strip = s => s.replace(/^舌(质|体|色|形|苔)?/, '').replace(/^苔/, '');
        const cc = strip(correctVal);
        if (!cc) return false;
        return u.includes(cc) || (cc.length >= 2 && cc.split('').some((_, i) => u.includes(cc.substr(i, 2))));
    }

    /* ===================== 提交辨证 ===================== */
    function submitAnswer() {
        if (!gameStarted || !currentCase) { alert('请先选择难度。'); return; }
        const syndrome = document.getElementById('inputSyndrome').value.trim();
        const disease = document.getElementById('inputDisease').value.trim();
        const basis = document.getElementById('inputBasis').value.trim();
        if (!syndrome && !disease) { alert('请至少输入证型或病名。'); return; }
        if (!basis) { alert('请写出你的辩证依据。'); return; }
        const correct = currentCase.correctAnswer;
        const fb = document.getElementById('answerFeedback');
        const analysis = document.getElementById('fullAnalysisArea');
        const dOk = disease && correct.disease.includes(disease.replace(/证$/, ''));
        const sOk = syndrome && (
            correct.syndrome.includes('风热') && syndrome.includes('风热') && syndrome.includes('津伤') ||
            correct.syndrome.includes('脾胃虚寒') && syndrome.includes('脾胃虚寒') ||
            correct.syndrome.includes('痰瘀互结') && syndrome.includes('痰瘀') && syndrome.includes('互结') ||
            correct.syndrome.includes('痰热壅肺') && syndrome.includes('痰热壅肺') ||
            syndrome === correct.syndrome || correct.syndrome.includes(syndrome) || syndrome.includes(correct.syndrome)
        );
        const isCorrect = dOk && sOk;
        lastAnswerWasCorrect = isCorrect;
        let feedbackHtml = '';
        if (isCorrect) {
            feedbackHtml = `<div class="result-box success"><h4>🎉 辨证正确！</h4><p>${correct.disease} · ${correct.syndrome}</p>`;
            removeWrongCase(currentCase.id);
        } else {
            if (!dOk && !sOk) {
                feedbackHtml = `<div class="result-box fail"><h4>🤔 辨证偏差较大</h4><p>建议继续探查四诊信息。</p>`;
            } else {
                const parts = [];
                if (dOk) parts.push('✅ 病名基本正确'); else parts.push('⚠️ 病名需调整');
                if (sOk) parts.push('✅ 证型判断准确'); else parts.push('⚠️ 证型需斟酌');
                feedbackHtml = `<div class="result-box fail"><h4>🔍 部分正确</h4><p>${parts.join('，')}</p>`;
            }
            saveWrongCase({ syndrome, disease, basis });
        }
        feedbackHtml += `<button class="btn btn--outline" style="margin-top:10px;" onclick="viewAnswer()">💡 显示答案</button></div>`;
        fb.innerHTML = feedbackHtml;
        analysis.innerHTML = '';
        fb.scrollIntoView({ behavior: 'smooth' });
    }

        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            if (file.size > 10 * 1024 * 1024) { feedback.innerHTML = `<div class="result-box fail">舌象照片大小不能超过10MB，请压缩后重新上传。</div>`; return false; }
        }
        feedback.innerHTML = '';
        return true;
    }

    /* ===================== 全局事件 ===================== */
    document.addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); });
    window.addEventListener('load', function() {
        if (window.location.search.includes('submitted=true')) {
            if (history.replaceState) history.replaceState(null, '', window.location.pathname);
            openSubmissionModal();
            document.getElementById('submissionFeedback').innerHTML = '<div class="result-box success">✅ 病例提交成功！感谢您的投稿。</div>';
        }
    });

    /* ===================== 启动 ===================== */
    loadCaseData();
</script>
</body>
</html>
