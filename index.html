<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医辨证推演馆 - 海龟汤模式</title>
    <style>
        :root {
            --bg: #fdf8f3;
            --card: #fffefb;
            --primary: #8b4513;
            --primary-light: #a0522d;
            --accent: #c0392b;
            --accent-light: #e74c3c;
            --gold: #b8860b;
            --gold-light: #d4a745;
            --text: #3e2723;
            --text-light: #5d4037;
            --text-muted: #7b5b4e;
            --border: #e0d5c7;
            --shadow: 0 4px 20px rgba(139, 69, 19, 0.10);
            --shadow-lg: 0 12px 40px rgba(139, 69, 19, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-heading: 'STSong', 'Songti SC', 'Noto Serif SC', 'KaiTi', 'STKaiti', '楷体', 'SimSun', '宋体', serif;
            --font-body: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(184, 134, 11, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 60%, rgba(139, 69, 19, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 80%, rgba(160, 82, 45, 0.03) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px; right: -120px;
            width: 400px; height: 400px;
            border-radius: 50%;
            border: 1px solid rgba(184, 134, 11, 0.08);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -80px; left: -100px;
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 1px solid rgba(139, 69, 19, 0.06);
            pointer-events: none; z-index: 0;
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            position: relative; z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .page {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeSlideIn 0.45s ease;
        }
        .page.active { display: flex; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.88); }
            60% { transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.35); }
            50% { box-shadow: 0 0 0 18px rgba(192, 57, 43, 0); }
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 30px;
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card--accent { border-left: 5px solid var(--accent); }
        .card--gold { border-left: 5px solid var(--gold); }
        .card--highlight {
            background: linear-gradient(135deg, #fffefb 0%, #fef9f2 100%);
            border: 2px solid var(--gold-light);
            box-shadow: 0 6px 28px rgba(184, 134, 11, 0.18);
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 2.6em; font-weight: 700;
            color: var(--primary);
            text-align: center;
            letter-spacing: 0.04em; margin-bottom: 4px;
            line-height: 1.3;
        }
        .hero-title .icon { display: inline-block; font-size: 1.1em; animation: popIn 0.6s ease; }
        .hero-subtitle {
            text-align: center; color: var(--text-muted);
            font-size: 1.05em; margin-bottom: 8px;
            font-family: var(--font-heading); letter-spacing: 0.03em;
        }
        .hero-desc {
            text-align: center; color: var(--text-light);
            font-size: 0.95em; background: rgba(184, 134, 11, 0.05);
            border-radius: 20px; padding: 14px 20px; line-height: 1.7;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 28px; border-radius: 28px; border: none; cursor: pointer;
            font-size: 1.05em; font-weight: 600; letter-spacing: 0.03em;
            transition: var(--transition); font-family: var(--font-body);
            white-space: nowrap; position: relative; text-decoration: none; user-select: none;
        }
        .btn:active { transform: scale(0.96); }
        .btn--primary {
            background: var(--accent); color: #fff; font-size: 1.2em;
            padding: 16px 40px; border-radius: 32px; letter-spacing: 0.05em;
            box-shadow: 0 6px 22px rgba(192, 57, 43, 0.35);
            animation: pulse 2.5s infinite;
        }
        .btn--primary:hover {
            background: #a93226; box-shadow: 0 10px 30px rgba(192, 57, 43, 0.45);
            transform: translateY(-2px); animation: none;
        }
        .btn--primary:active { animation: none; }
        .btn--outline {
            background: transparent; border: 2px solid var(--primary);
            color: var(--primary); padding: 10px 20px; font-size: 0.9em; border-radius: 24px;
        }
        .btn--outline:hover { background: rgba(139,69,19,0.06); border-color: var(--primary-light); }
        .btn--ghost {
            background: rgba(139,69,19,0.04); color: var(--text-light);
            padding: 9px 18px; font-size: 0.88em; border-radius: 22px; border: 1px solid transparent;
        }
        .btn--ghost:hover { background: rgba(139,69,19,0.1); border-color: var(--border); }

        .btn--difficulty {
            flex: 1; min-width: 100px; padding: 16px 18px; border-radius: var(--radius-sm);
            font-weight: 700; font-size: 1em; border: 2px solid transparent;
            transition: var(--transition); font-family: var(--font-heading);
        }
        .btn--difficulty.btn--basic { background: #f0faf0; color: #2d6a4f; border-color: #b7d7c5; }
        .btn--difficulty.btn--basic:hover { background: #d8f0e0; border-color: #6aaf8a; }
        .btn--difficulty.btn--intermediate { background: #fef9ee; color: #8b6914; border-color: #e0d0a0; }
        .btn--difficulty.btn--intermediate:hover { background: #fdf3d6; border-color: #c9a84c; }
        .btn--difficulty.btn--advanced { background: #fdf4f4; color: #8b1a1a; border-color: #dbb5b5; }
        .btn--difficulty.btn--advanced:hover { background: #fce8e8; border-color: #c45a5a; }
        .btn--difficulty.selected {
            transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.2) !important;
            border-width: 3px !important;
        }
        .btn--basic.selected { border-color: #2d6a4f !important; background: #c8e8d4 !important; }
        .btn--intermediate.selected { border-color: #8b6914 !important; background: #fcecb8 !important; }
        .btn--advanced.selected { border-color: #8b1a1a !important; background: #fad4d4 !important; }

        .four-diagnosis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 500px) {
            .four-diagnosis { grid-template-columns: repeat(2, 1fr); }
            .hero-title { font-size: 1.8em; }
            .btn--primary { font-size: 1em; padding: 14px 28px; }
            .card { padding: 18px 16px; }
        }

        .btn--diag {
            padding: 16px 12px; border-radius: var(--radius-sm); font-weight: 700;
            font-size: 1.05em; border: 2px solid var(--border); background: var(--card);
            color: var(--primary); cursor: pointer; transition: var(--transition);
            font-family: var(--font-heading); display: flex; flex-direction: column;
            align-items: center; gap: 6px;
        }
        .btn--diag:hover { border-color: var(--primary-light); box-shadow: 0 6px 20px rgba(139,69,19,0.18); transform: translateY(-2px); background: #fffdf9; }
        .btn--diag:active { transform: scale(0.94); }
        .btn--diag.explored { background: #f9f5ef; border-color: #c9b896; color: #6b4d34; cursor: default; opacity: 0.75; }
        .btn--diag.explored::after { content: '✓'; font-size: 0.75em; color: #6b9e6b; position: absolute; top: 6px; right: 10px; }
        .btn--diag .diag-icon { font-size: 1.6em; line-height: 1; }
        .btn--diag .diag-label { font-size: 0.85em; }

        .clue-area {
            background: #fdfaf5; border-radius: var(--radius-sm); padding: 16px 18px;
            border: 1px dashed var(--border); min-height: 60px; max-height: 280px; overflow-y: auto;
        }
        .clue-area:empty::before {
            content: '🔍 线索收集区：点击上方四诊按钮探查线索...';
            color: #c5b5a0; font-style: italic; font-size: 0.9em;
            display: block; text-align: center; padding: 20px 0;
        }
        .clue-item {
            display: flex; gap: 10px; padding: 10px 14px; margin: 6px 0;
            background: #fffefb; border-radius: 8px; border-left: 3px solid var(--gold);
            animation: popIn 0.35s ease; font-size: 0.93em;
        }
        .clue-item .clue-tag { font-weight: 700; font-size: 0.8em; padding: 3px 10px; border-radius: 12px; color: #fff; }
        .tag-wang { background: #5b8c5a; } .tag-wen { background: #b8860b; } .tag-ask { background: #7b5ea7; } .tag-pulse { background: #c0392b; }

        .answer-area { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .answer-area input {
            flex: 1; min-width: 140px; padding: 12px 16px; border-radius: 24px;
            border: 2px solid var(--border); font-size: 0.95em; background: #fffefb; outline: none;
        }
        .answer-area input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(139,69,19,0.07); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(30,15,5,0.55); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.25s; padding: 20px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--card); border-radius: var(--radius); padding: 28px 26px;
            max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto;
            box-shadow: var(--shadow-lg); animation: popIn 0.4s;
            position: relative; border: 1px solid var(--border);
        }
        .modal-close {
            position: absolute; top: 12px; right: 16px; width: 36px; height: 36px;
            border-radius: 50%; border: none; background: rgba(0,0,0,0.05);
            cursor: pointer; font-size: 1.2em; display: flex; align-items: center;
            justify-content: center; color: var(--text-muted);
        }
        .modal-close:hover { background: rgba(0,0,0,0.12); color: var(--text); }
        .modal h3 { font-family: var(--font-heading); color: var(--primary); margin-bottom: 14px; }

        .tongue-sim { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
        .tongue-visual {
            width: 80px; height: 110px; border-radius: 40px 40px 30px 30px;
            background: linear-gradient(180deg, #f0c8c0 30%, #e8b4b0 60%, #e0a8a0 100%);
            border: 3px solid #d4a098; box-shadow: inset 0 0 20px rgba(180,130,120,0.3);
            position: relative;
        }
        .tongue-visual::after {
            content: ''; position: absolute; top: 25%; left: 15%;
            width: 70%; height: 45%; background: rgba(220,195,150,0.55);
            border-radius: 35px 35px 20px 20px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(200,170,120,0.3) 3px, rgba(200,170,120,0.3) 5px);
        }

        .result-box { padding: 20px; border-radius: var(--radius-sm); margin: 12px 0; animation: popIn 0.4s; line-height: 1.7; }
        .result-box.success { background: #f0faf4; border: 2px solid #6aaf8a; color: #1e4d34; }
        .result-box.fail { background: #fef9f4; border: 2px solid #e0b060; color: #6b4d20; }

        .chat-area {
            flex: 1; overflow-y: auto; min-height: 160px; max-height: 300px;
            background: #fdfaf5; border-radius: 12px; padding: 14px; margin-bottom: 12px;
            border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px;
        }
        .chat-bubble {
            max-width: 85%; padding: 10px 14px; border-radius: 18px;
            line-height: 1.5; font-size: 0.93em; animation: popIn 0.25s;
        }
        .chat-bubble.user { align-self: flex-end; background: #e8f0fe; color: #1a3a5c; }
        .chat-bubble.patient { align-self: flex-start; background: #f5eee0; color: #4a3b2c; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input {
            flex: 1; padding: 12px 16px; border-radius: 24px;
            border: 2px solid var(--border); font-size: 0.95em; background: #fffefb; outline: none;
        }
        .chat-input-area button {
            padding: 10px 20px; border-radius: 24px; background: var(--primary);
            color: #fff; border: none; cursor: pointer; font-weight: 600;
        }

        .copyright {
            position: fixed; bottom: 14px; right: 20px;
            font-size: 0.8em; color: #b5a595; letter-spacing: 0.06em;
            z-index: 999; font-family: var(--font-heading); pointer-events: none;
            background: rgba(253,248,243,0.7); padding: 4px 10px;
            border-radius: 12px; backdrop-filter: blur(4px);
        }
        .top-nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 4px; }
        .top-nav .nav-link {
            font-size: 0.85em; color: var(--text-muted); cursor: pointer;
            padding: 6px 14px; border-radius: 16px; font-family: var(--font-heading);
            border: 1px solid transparent; background: transparent;
        }
        .top-nav .nav-link:hover { color: var(--primary); background: rgba(139,69,19,0.05); }
        .top-nav .nav-link.nav-active { color: var(--accent); font-weight: 700; background: rgba(192,57,43,0.06); border-color: rgba(192,57,43,0.2); }
    </style>
</head>
<body>
<div class="copyright">© wuruilin</div>
<div class="app-container" id="appContainer">

    <div class="page active" id="pageHome">
        <div class="card card--accent" style="text-align:center;">
            <div class="hero-title"><span class="icon">🏥</span> 中医辨证推演馆</div>
            <div class="hero-subtitle">—— 海龟汤式 · 四诊探案 ——</div>
            <div class="hero-desc">
                模拟门诊看病，如同海龟汤解谜。<br>
                仅凭<strong>主诉</strong>，通过<strong>望、闻、问、切</strong>四诊探寻线索，逐步推理，完成辨证论治。
            </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <button class="btn btn--primary" onclick="startChallenge()">🎯 开始闯关</button>
            <button class="btn btn--outline" onclick="openCaseBank()">📚 病例题库</button>
            <button class="btn btn--ghost" onclick="openRecords()">📝 学习记录</button>
        </div>
    </div>

    <div class="page" id="pageGame">
        <div class="card" style="padding:16px 20px;">
            <div style="font-weight:700;color:var(--text-light);text-align:center;">📋 选择难度</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;" id="difficultyBtns">
                <button class="btn btn--difficulty btn--basic" data-diff="basic" onclick="selectDifficulty('basic', this)">🌱 基础<br><small>（大一）</small></button>
                <button class="btn btn--difficulty btn--intermediate" data-diff="intermediate" onclick="selectDifficulty('intermediate', this)">📖 进阶<br><small>（内外妇儿）</small></button>
                <button class="btn btn--difficulty btn--advanced" data-diff="advanced" onclick="selectDifficulty('advanced', this)">🎓 考研病例</button>
            </div>
        </div>
        <div class="card card--highlight" id="chiefComplaintCard" style="display:none;">
            <div style="font-weight:700;color:var(--accent);">🩺 病例主诉（谜面）</div>
            <div id="chiefComplaintText" style="margin-top:8px;"></div>
            <div style="font-size:0.78em;color:var(--text-muted);margin-top:6px;">⚡ 请通过下方四诊按钮主动探查线索</div>
        </div>
        <div class="four-diagnosis" id="fourDiagBtns" style="display:none;">
            <button class="btn btn--diag" id="btnWang" onclick="exploreDiag('inspection')"><span class="diag-icon">👁️</span><span class="diag-label">望 诊</span></button>
            <button class="btn btn--diag" id="btnWen" onclick="exploreDiag('auscultation')"><span class="diag-icon">👂</span><span class="diag-label">闻 诊</span></button>
            <button class="btn btn--diag" id="btnAsk" onclick="exploreDiag('inquiry')"><span class="diag-icon">💬</span><span class="diag-label">问 诊</span></button>
            <button class="btn btn--diag" id="btnPulse" onclick="exploreDiag('pulse')"><span class="diag-icon">🫀</span><span class="diag-label">切 脉</span></button>
        </div>
        <div class="card" id="clueCollectionCard" style="display:none;">
            <div style="font-weight:700;color:var(--text-light);">📋 线索收集区</div>
            <div class="clue-area" id="clueArea"></div>
        </div>
        <div class="card" id="answerCard" style="display:none;">
            <div style="font-weight:700;color:var(--text-light);">✍️ 提交辨证</div>
            <div class="answer-area">
                <input type="text" id="inputSyndrome" placeholder="证型">
                <input type="text" id="inputDisease" placeholder="病名">
                <button class="btn btn--primary" style="padding:12px 22px;font-size:0.95em;animation:none;" onclick="submitAnswer()">提交答案</button>
            </div>
            <div id="answerFeedback"></div>
            <div id="fullAnalysisArea"></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:center;" id="gameExtraBtns">
            <button class="btn btn--outline" onclick="resetCurrentCase()">🔄 重新探查</button>
            <button class="btn btn--ghost" onclick="goHome()">🏠 返回首页</button>
        </div>
    </div>

    <div class="page" id="pageAbout">
        <div class="card card--gold" style="text-align:center;">
            <div style="font-size:1.6em;color:var(--primary);">📖 关于本站</div>
            <div style="margin-top:16px;line-height:1.8;color:var(--text-light);">
                <strong>中医辨证推演馆</strong> 是一款中医趣味学习工具。<br><br>
                灵感来源于「海龟汤」解谜游戏，仅给出<strong>病例主诉</strong>，学习者需主动运用望闻问切，逐步收集线索，推理证型与病名。<br>
                适合中医备考、记忆辨证思路。<br><br>
                <span style="color:var(--accent);font-weight:700;">@wuruilin</span>
            </div>
        </div>
        <div style="text-align:center;"><button class="btn btn--outline" onclick="goHome()">🏠 返回首页</button></div>
    </div>
</div>

<div class="modal-overlay" id="inquiryModal" style="display:none;">
    <div class="modal" style="max-width:600px;">
        <button class="modal-close" onclick="closeInquiryModal()">✕</button>
        <h3>💬 问诊 — 请向患者提问</h3>
        <div class="chat-area" id="inquiryChatArea"></div>
        <div class="chat-input-area">
            <input type="text" id="inquiryInput" placeholder="输入您想问的问题..." onkeydown="if(event.key==='Enter')sendInquiry()">
            <button onclick="sendInquiry()">发送</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="inspectionModal" style="display:none;">
    <div class="modal">
        <button class="modal-close" onclick="closeInspectionModal()">✕</button>
        <h3>👁️ 望诊 — 舌象观察</h3>
        <div class="tongue-sim"><div class="tongue-visual"></div><div class="tongue-desc" id="inspectionDesc"></div></div>
        <button class="btn btn--primary" style="margin-top:12px;width:100%;animation:none;" onclick="closeInspectionModal()">确认观察完毕</button>
    </div>
</div>

<div class="modal-overlay" id="simpleResultModal" style="display:none;">
    <div class="modal">
        <button class="modal-close" onclick="closeSimpleResultModal()">✕</button>
        <h3 id="simpleResultTitle"></h3>
        <div id="simpleResultContent"></div>
        <button class="btn btn--primary" style="margin-top:12px;width:100%;animation:none;" onclick="closeSimpleResultModal()">知道了</button>
    </div>
</div>

<div class="modal-overlay" id="caseBankModal" style="display:none;">
    <div class="modal" style="max-width:600px; max-height:80vh; overflow-y:auto;">
        <button class="modal-close" onclick="closeCaseBank()">✕</button>
        <h3>📚 病例题库</h3>
        <div id="caseBankContent"></div>
    </div>
</div>

<div class="modal-overlay" id="recordsModal" style="display:none;">
    <div class="modal" style="max-width:600px;">
        <button class="modal-close" onclick="closeRecords()">✕</button>
        <h3>📝 学习记录</h3>
        <div id="recordsContent"></div>
    </div>
</div>

<script>
    const casesDB = {
        basic: [
            {
                id: 'basic-001',
                title: '咳嗽案（风热犯肺津伤）',
                chiefComplaint: '陈某，男，33岁。就诊日期：2021年9月6日。\n\n咳嗽4天。',

    function getCompletedCases() {
        return JSON.parse(localStorage.getItem('tcm_completed_cases') || '[]');
    }
    function markCaseCompleted(caseId) {
        const arr = getCompletedCases();
        if (!arr.includes(caseId)) {
            arr.push(caseId);
            localStorage.setItem('tcm_completed_cases', JSON.stringify(arr));
        }
    }

    function showPage(name) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page'+name)?.classList.add('active');
        window.scrollTo({top:0,behavior:'smooth'});
        document.querySelectorAll('.top-nav .nav-link').forEach(l=>l.classList.remove('nav-active'));
        const map={Home:'navHome',Game:'navGame',About:'navAbout'};
        document.getElementById(map[name])?.classList.add('nav-active');
    }
    function goHome(){ showPage('Home'); }
    function startChallenge(){ showPage('Game'); resetGameUI(); }
    function showAbout(){ showPage('About'); }

    function resetGameUI(){
        currentDifficulty=null; currentCase=null; collectedClues=[]; exploredDiags={}; gameStarted=false;
        inquiryHistory=[]; askedInquiryQuestions=[];
        document.getElementById('chiefComplaintCard').style.display='none';
        document.getElementById('fourDiagBtns').style.display='none';
        document.getElementById('clueCollectionCard').style.display='none';

        document.getElementById('gameExtraBtns').style.display='none';
        document.getElementById('clueArea').innerHTML='';
        document.getElementById('answerFeedback').innerHTML='';
        document.getElementById('fullAnalysisArea').innerHTML='';
        document.getElementById('inputSyndrome').value='';
        document.getElementById('inputDisease').value='';
        document.querySelectorAll('#difficultyBtns .btn--difficulty').forEach(b=>b.classList.remove('selected'));
        ['btnWang','btnWen','btnAsk','btnPulse'].forEach(id=>document.getElementById(id)?.classList.remove('explored'));
    }

    function selectDifficulty(diff, btnEl){
        document.querySelectorAll('#difficultyBtns .btn--difficulty').forEach(b=>b.classList.remove('selected'));
        btnEl.classList.add('selected');
        currentDifficulty = diff;
        const pool = casesDB[diff];
        if(!pool || pool.length===0){ alert('该难度暂无病例。'); return; }
        const completed = getCompletedCases();
        let available = pool.filter(c => !completed.includes(c.id));
        if(available.length === 0){
            const newCompleted = completed.filter(id => !pool.some(c => c.id === id));
            localStorage.setItem('tcm_completed_cases', JSON.stringify(newCompleted));
            available = pool;
        }
        const randomIndex = Math.floor(Math.random() * available.length);
        currentCase = available[randomIndex];
        collectedClues=[]; exploredDiags={inspection:false,auscultation:false,inquiry:false,pulse:false};
        inquiryHistory=[]; askedInquiryQuestions=[]; gameStarted=true;
        document.getElementById('chiefComplaintCard').style.display='block';
        document.getElementById('chiefComplaintText').textContent = currentCase.chiefComplaint;
        document.getElementById('fourDiagBtns').style.display='grid';
        document.getElementById('clueCollectionCard').style.display='block';
        document.getElementById('answerCard').style.display='block';
        document.getElementById('gameExtraBtns').style.display='flex';
        document.getElementById('clueArea').innerHTML='';
        document.getElementById('answerFeedback').innerHTML='';
        document.getElementById('fullAnalysisArea').innerHTML='';
        document.getElementById('inputSyndrome').value='';
        document.getElementById('inputDisease').value='';
        ['btnWang','btnWen','btnAsk','btnPulse'].forEach(id=>document.getElementById(id)?.classList.remove('explored'));
        document.getElementById('chiefComplaintCard').scrollIntoView({behavior:'smooth',block:'center'});
    }

    function exploreDiag(type){
        if(!gameStarted||!currentCase){ alert('请先选择难度。'); return; }
        if(type==='inquiry'){ openInquiryModal(); return; }
        if(type==='inspection'){ openInspectionModal(); return; }
        if(exploredDiags[type]){ alert('该诊法已探索过。'); return; }
        exploredDiags[type]=true; markExplored(type);
        const clue = currentCase.clues[type];
        if(clue){ openSimpleResultModal(clue.displayTitle, clue.displayContent); addClue(type, clue.textSummary); }
    }

    function openInquiryModal(){
        if(!currentCase) return;
        document.getElementById('inquiryChatArea').innerHTML='';
        inquiryHistory.forEach(m=>appendChat(m.role,m.text));
        document.getElementById('inquiryInput').value='';
        document.getElementById('inquiryModal').style.display='flex';
        document.getElementById('inquiryInput').focus();
    }
    function appendChat(role,text){
        const div=document.createElement('div');
        div.className='chat-bubble '+(role==='user'?'user':'patient');
        div.textContent=text;
        document.getElementById('inquiryChatArea').appendChild(div);
        document.getElementById('inquiryChatArea').scrollTop=document.getElementById('inquiryChatArea').scrollHeight;
    }
    function sendInquiry(){
        const input=document.getElementById('inquiryInput');
        const q=input.value.trim(); if(!q||!currentCase) return;
        inquiryHistory.push({role:'user',text:q}); appendChat('user',q);
        input.value='';
        const questions=currentCase.clues.inquiry.questions;
        let matched=-1;
        for(let i=0;i<questions.length;i++){
            if(questions[i].keywords.some(k=>q.includes(k))){ matched=i; break; }
        }
        let answer='';
        if(matched>=0){
            answer=questions[matched].a;
            if(!askedInquiryQuestions.includes(matched)){
                askedInquiryQuestions.push(matched);
                addClue('inquiry', answer, '问诊·'+questions[matched].q);
            } else { answer+='（这个问题刚才已经回答过了）'; }
        } else {
            answer=genericAnswers[Math.floor(Math.random()*genericAnswers.length)];
        }
        setTimeout(()=>{
            inquiryHistory.push({role:'patient',text:answer}); appendChat('patient',answer);
            if(askedInquiryQuestions.length>=questions.length){ exploredDiags.inquiry=true; markExplored('inquiry'); }
        },300);
    }
    function closeInquiryModal(){
        document.getElementById('inquiryModal').style.display='none';
        if(currentCase && askedInquiryQuestions.length>=currentCase.clues.inquiry.questions.length){
            exploredDiags.inquiry=true; markExplored('inquiry');
        }
    }

    function openInspectionModal(){
        if(!currentCase||exploredDiags.inspection){ alert('望诊已观察过。'); return; }
        document.getElementById('inspectionDesc').textContent=currentCase.clues.inspection.tongueDesc;
        document.getElementById('inspectionModal').style.display='flex';
    }
    function closeInspectionModal(){
        document.getElementById('inspectionModal').style.display='none';
        if(!exploredDiags.inspection && currentCase){
            exploredDiags.inspection=true; markExplored('inspection');
            addClue('inspection', currentCase.clues.inspection.textSummary);
        }
    }

    function openSimpleResultModal(title,content){
        document.getElementById('simpleResultTitle').textContent=title;
        document.getElementById('simpleResultContent').textContent=content;
        document.getElementById('simpleResultModal').style.display='flex';
    }
    function closeSimpleResultModal(){ document.getElementById('simpleResultModal').style.display='none'; }

    function markExplored(type){
        const map={inspection:'btnWang',auscultation:'btnWen',inquiry:'btnAsk',pulse:'btnPulse'};
        document.getElementById(map[type])?.classList.add('explored');
    }

    function addClue(type, content, tagText){
        const tagMap={inspection:'tag-wang',auscultation:'tag-wen',inquiry:'tag-ask',pulse:'tag-pulse'};
        const nameMap={inspection:'望诊',auscultation:'闻诊',inquiry:'问诊',pulse:'切脉'};
        const tag=tagText||nameMap[type];
        if(collectedClues.some(c=>c.content===content&&c.tag===tag)) return;
        collectedClues.push({tag, tagClass:tagMap[type], content});
        renderClues();
    }
    function renderClues(){
        const area=document.getElementById('clueArea');
        area.innerHTML=collectedClues.map(c=>`<div class="clue-item"><span class="clue-tag ${c.tagClass}">${c.tag}</span><span>${c.content}</span></div>`).join('');
        area.scrollTop=area.scrollHeight;
    }

    function submitAnswer(){
        if(!gameStarted||!currentCase){ alert('请先选择难度。'); return; }
        const syndrome=document.getElementById('inputSyndrome').value.trim();
        const disease=document.getElementById('inputDisease').value.trim();
        if(!syndrome&&!disease){ alert('请至少输入证型或病名。'); return; }
        const correct=currentCase.correctAnswer;
        const fb=document.getElementById('answerFeedback');
        const analysis=document.getElementById('fullAnalysisArea');
        const dOk=disease && correct.disease.includes(disease.replace(/证$/,''));
        const sOk=syndrome && (correct.syndrome.includes('风热')&&syndrome.includes('风热')&&syndrome.includes('津伤') ||
            correct.syndrome.includes('脾胃虚寒')&&syndrome.includes('脾胃虚寒') ||
            correct.syndrome.includes('痰瘀互结')&&syndrome.includes('痰瘀')&&syndrome.includes('互结') ||
            correct.syndrome.includes('痰热壅肺')&&syndrome.includes('痰热壅肺') ||
            syndrome===correct.syndrome);
        if(dOk&&sOk){
            fb.innerHTML=`<div class="result-box success"><h4>🎉 辨证正确！</h4><p>${correct.disease} · ${correct.syndrome}</p></div>`;
            showFullAnalysis(analysis);
            saveRecord(true);
            markCaseCompleted(currentCase.id);
        } else {
            let feedbackHtml = '';
            if(!dOk && !sOk){
                feedbackHtml = `<div class="result-box fail"><h4>🤔 辨证偏差较大</h4><p>建议继续探查四诊信息。</p>`;
            } else {
                const parts=[];
                if(dOk) parts.push('✅ 病名基本正确'); else parts.push('⚠️ 病名需调整');
                if(sOk) parts.push('✅ 证型判断准确'); else parts.push('⚠️ 证型需斟酌');
                feedbackHtml = `<div class="result-box fail"><h4>🔍 部分正确</h4><p>${parts.join('，')}</p>`;
            }
            feedbackHtml += `<button class="btn btn--outline" style="margin-top:10px;" onclick="viewAnswer()">💡 查看答案</button></div>`;
            fb.innerHTML = feedbackHtml;
            analysis.innerHTML = '';
        }
        fb.scrollIntoView({behavior:'smooth'});
    }

        if(!currentCase) return;
        showFullAnalysis(document.getElementById('fullAnalysisArea'));
        markCaseCompleted(currentCase.id);
        saveRecord(false); // 记录为查看答案

    }

    function saveRecord(correct){
        const records=JSON.parse(localStorage.getItem('tcm_learning_records')||'[]');
        records.push({date:new Date().toLocaleString(),case:currentCase.title,difficulty:currentDifficulty,correct});
        if(records.length>50) records.shift();
        localStorage.setItem('tcm_learning_records',JSON.stringify(records));
    }

    function openRecords(){
        const records=JSON.parse(localStorage.getItem('tcm_learning_records')||'[]');
        const el=document.getElementById('recordsContent');
        if(records.length===0) el.innerHTML='<p style="text-align:center;color:#b5a595;">📭 暂无学习记录</p>';
        else el.innerHTML=records.reverse().map((r,i)=>`<div style="padding:8px;margin:4px 0;background:#fdfaf5;border-radius:8px;">${r.date} ${r.case} (${r.difficulty}) ${r.correct?'✅':'⚠️'}</div>`).join('')
            +'<button class="btn btn--ghost" style="margin-top:10px;width:100%;" onclick="clearRecords()">🗑️ 清空记录</button>';
        document.getElementById('recordsModal').style.display='flex';
    }
    function closeRecords(){ document.getElementById('recordsModal').style.display='none'; }
    function clearRecords(){ if(confirm('清空学习记录？')){ localStorage.removeItem('tcm_learning_records'); closeRecords(); } }

    function openCaseBank(){
        const labels={basic:'🌱 基础（大一）',intermediate:'📖 进阶',advanced:'🎓 考研'};
        const completedIds = getCompletedCases();
        let html='';
        for(const [diff,cases] of Object.entries(casesDB)){
            html+=`<h4 style="margin-top:14px;color:var(--primary);">${labels[diff]}</h4>`;
            cases.forEach(c=>{
                const isCompleted = completedIds.includes(c.id);
                let content = `<strong>${c.title}</strong><br>`;
                content += `主诉：${c.chiefComplaint.replace(/\n/g,'<br>')}<br>`;
                if(isCompleted){
                    content += `<span style="color:var(--accent);font-weight:600;">✅ 已完成</span><br>`;
                    content += `病名：${c.correctAnswer.disease} | 证型：${c.correctAnswer.syndrome}<br>`;
                    if(c.correctAnswer.westernDiagnosis) content += `西医诊断：${c.correctAnswer.westernDiagnosis}<br>`;
                } else {
                    content += `<span style="color:var(--text-muted);">❓ 尚未完成</span>`;
                }
                html += `<div style="padding:10px;margin:6px 0;background:#fdfaf5;border-radius:8px;border:1px solid var(--border);font-size:0.9em;">${content}</div>`;
            });
        }
        document.getElementById('caseBankContent').innerHTML = html;
        document.getElementById('caseBankModal').style.display='flex';
    }
    function closeCaseBank(){ document.getElementById('caseBankModal').style.display='none'; }

    document.addEventListener('click',e=>{ if(e.target.classList.contains('modal-overlay')) e.target.style.display='none'; });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none'); });

    (function initNav(){
        const nav=`<div class="top-nav"><span class="nav-link nav-active" id="navHome" onclick="goHome()">🏠 首页</span><span class="nav-link" id="navGame" onclick="startChallenge()">🎯 闯关</span><span class="nav-link" id="navAbout" onclick="showAbout()">📖 关于</span></div>`;
        document.getElementById('appContainer').insertAdjacentHTML('afterbegin',nav);
    })();
    showPage('Home');
</script>
</body>
</html>
