<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医辨证推演馆</title>
<meta name="description" content="中医病例互动学习网站：通过望闻问切、舌诊判断、辨证依据与错题复习训练中医辨证思维。">
<style>
:root{
  --bg:#fdf8f3;--card:#fffefb;--primary:#7a3d17;--primary2:#9a5226;
  --accent:#a9362b;--green:#3f7b57;--gold:#b8860b;--text:#3e2723;--muted:#75635a;
  --border:#e3d7c9;--shadow:0 8px 28px rgba(95,54,24,.10);--radius:16px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fdf8f3,#f7efe7);
font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);line-height:1.65}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{width:min(960px,calc(100% - 28px));margin:0 auto;padding:30px 0 70px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:24px;margin:16px 0}
h1,h2,h3{margin-top:0;font-family:"STSong","Songti SC","KaiTi",serif}
h1{font-size:2.3rem;color:var(--primary);text-align:center;margin-bottom:6px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:18px}
.notice{background:#fff8ea;border:1px solid #ead4a8;border-radius:12px;padding:12px 14px;color:#735b2b;font-size:.93rem}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:#f5efe8;color:var(--primary);border:1px solid var(--border)}
.btn-green{background:var(--green);color:#fff}
.btn-danger{background:#f7e2de;color:#8d2d24;border:1px solid #edc2bb}
.btn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.level{padding:18px;border-radius:14px;border:2px solid transparent;text-align:left;background:#fff}
.level strong{display:block;font-size:1.05rem;margin-bottom:6px}
.level small{color:var(--muted)}
.level.seed{border-color:#b8d8c1;background:#f4fbf5}.level.comprehensive{border-color:#e1cf9f;background:#fffaf0}.level.clinical{border-color:#e2bcbc;background:#fff6f6}
.level.selected{box-shadow:0 0 0 3px rgba(169,54,43,.12)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:#f3ece4;color:var(--primary);font-size:.86rem}
.case-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.case-meta{color:var(--muted);font-size:.92rem}
.chief{font-size:1.25rem;font-weight:700;color:var(--primary);background:#fff8f0;padding:16px;border-radius:12px}
.diag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.diag-btn{padding:14px 8px;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--primary);font-weight:700}
.diag-btn.used{background:#f3efe9;color:#8d7a68}
.clues{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.clue{padding:10px 12px;border-radius:10px;background:#fff;border-left:4px solid var(--gold)}
.clue .tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:999px;background:#eadbb9;margin-right:8px}
.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea{width:100%;border:2px solid var(--border);border-radius:12px;padding:11px 13px;background:#fffefb;outline:none}
textarea{min-height:150px;resize:vertical}
label{display:block;font-weight:700;margin-bottom:7px}
.input-note{font-size:.84rem;color:var(--muted);margin-top:4px}
.score{font-size:1.4rem;font-weight:800;color:var(--accent)}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.score-box{background:#faf5ee;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.score-box b{display:block;font-size:1.15rem;margin-top:4px}
.tongue-modal{position:fixed;inset:0;background:rgba(39,25,16,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.tongue-modal.show{display:flex}
.modal-card{width:min(920px,100%);max-height:92vh;overflow:auto;background:#fffefb;border-radius:18px;position:relative;padding:18px}
.modal-label{position:absolute;left:18px;top:18px;background:rgba(0,0,0,.68);color:#fff;border-radius:999px;padding:4px 10px;font-size:.82rem;z-index:2}
.modal-close{position:absolute;right:14px;top:12px;z-index:2;border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:1.2rem}
.tongue-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.tongue-layout img{width:100%;max-height:60vh;object-fit:contain;background:#f7f2ec;border-radius:12px}
.tongue-form{background:#faf5ef;border-radius:12px;padding:14px}
.hidden{display:none!important}
.result-actions,.action-row{display:flex;gap:10px;flex-wrap:wrap}
.case-section{margin:14px 0}.case-section h3{font-size:1.1rem;color:var(--primary)}
.case-section p{white-space:pre-wrap}
.source-box{background:#f7f3ee;border:1px solid var(--border);border-radius:12px;padding:14px}
.source-title{font-weight:800;color:var(--primary)}
.error-card{background:#fff4f1;border:1px solid #ecc7bf}
.success-card{background:#f2faf4;border:1px solid #c4e0ca}
.wrong-item{border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0;background:#fff}
.wrong-item h3{margin-bottom:5px}
.wrong-time{color:var(--muted);font-size:.84rem}
.wrong-answer{white-space:pre-wrap;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:34px}
.mini{font-size:.86rem;color:var(--muted)}
@media(max-width:760px){
 .btn-grid{grid-template-columns:1fr}.diag-grid{grid-template-columns:repeat(2,1fr)}
 .answer-row,.tongue-layout{grid-template-columns:1fr}.score-grid{grid-template-columns:repeat(2,1fr)}
 .case-head{flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <section id="homePage" class="page active">
    <h1>🌿 中医辨证推演馆</h1>
    <div class="subtitle">通过望闻问切、舌诊判断与辨证分析，训练中医诊断思维</div>
    <div class="card">
      <div class="notice">本站“训练阶段”用于学习导航，不是专业机构对病例难度的权威评级；“考研相关”也不代表历年真题或官方命题范围。</div>
      <h2 style="margin-top:20px">选择训练阶段</h2>
      <div class="btn-grid">
        <button class="level seed" data-level="seed"><strong>🌱 入门训练</strong><small>适合刚开始学习辨证的同学</small></button>
        <button class="level comprehensive" data-level="comprehensive"><strong>🌿 综合训练</strong><small>适合已经掌握基本证候，需要综合四诊信息的同学</small></button>
        <button class="level clinical" data-level="clinical"><strong>🌳 临床思维</strong><small>适合希望挑战完整真实病例的同学</small></button>
      </div>
      <div class="action-row" style="margin-top:18px">
        <button class="btn btn-primary" id="startBtn">开始训练</button>
        <button class="btn btn-secondary" id="wrongBtn">我的错题（<span id="wrongCount">0</span>）</button>
      </div>
    </div>
    <div class="card">
      <h2>当前训练进度</h2>
      <div id="statsBox" class="mini"></div>
    </div>
  </section>

  <section id="gamePage" class="page">
    <div class="topbar">
      <button class="btn btn-secondary" id="backHomeBtn">← 返回首页</button>
      <div id="levelBadge" class="badge"></div>
    </div>
    <div class="card">
      <div class="case-head">
        <div>
          <div id="caseTitle" class="mini"></div>
          <h2 id="gameTitle"></h2>
        </div>
        <div id="caseIndex" class="case-meta"></div>
      </div>
      <div id="chiefComplaint" class="chief"></div>
    </div>

    <div class="card">
      <h2>四诊探查</h2>
      <div class="diag-grid">
        <button class="diag-btn" data-diag="望诊">👀<br>望诊</button>
        <button class="diag-btn" data-diag="闻诊">👂<br>闻诊</button>
        <button class="diag-btn" data-diag="问诊">💬<br>问诊</button>
        <button class="diag-btn" data-diag="切诊">🫳<br>切诊</button>
      </div>
      <div id="questionArea" style="margin-top:14px"></div>
      <div class="clues" id="clueArea" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2>提交辨证</h2>
      <div class="answer-row">
        <div><label>病名 / 病证</label><input id="diseaseInput" placeholder="例如：咳嗽、胃痛、胸痹"></div>
        <div><label>证型</label><input id="syndromeInput" placeholder="例如：风热犯肺"></div>
      </div>
      <div style="margin-top:14px">
        <label>请写出你的辨证依据</label>
        <textarea id="reasonInput" placeholder="请结合主诉、四诊信息、舌象、脉象等说明为什么这样辨证……"></textarea>
        <div class="input-note">这里记录的是你的临证思路；提交后会和本病例参考答案进行辅助评分。</div>
      </div>
      <div class="action-row" style="margin-top:14px">
        <button class="btn btn-primary" id="submitBtn">提交答案</button>
      </div>
    </div>
  </section>

  <section id="resultPage" class="page">
    <div class="card">
      <div class="topbar"><h2 style="margin:0">本次训练结果</h2><div id="resultLevel" class="badge"></div></div>
      <div id="scoreText" class="score" style="margin-top:10px"></div>
      <div id="scoreGrid" class="score-grid" style="margin-top:14px"></div>
      <div id="resultFeedback" style="margin-top:16px"></div>
      <div class="result-actions" style="margin-top:16px">
        <button class="btn btn-green" id="showAnswerBtn">显示完整病例</button>
        <button class="btn btn-secondary" id="retryNowBtn">重新挑战</button>
        <button class="btn btn-secondary" id="resultHomeBtn">返回首页</button>
      </div>
    </div>
  </section>

  <section id="fullCasePage" class="page">
    <div class="topbar">
      <button class="btn btn-secondary" id="fullBackBtn">← 返回结果</button>
      <button class="btn btn-secondary" id="fullRetryBtn">重新挑战</button>
    </div>
    <div class="card">
      <div class="case-head">
        <div><div id="fullLevel" class="badge"></div><h2 id="fullTitle" style="margin-top:10px"></h2></div>
        <div id="fullCaseId" class="case-meta"></div>
      </div>
      <div id="fullCaseContent"></div>
    </div>
  </section>

  <section id="wrongPage" class="page">
    <div class="topbar">
      <button class="btn btn-secondary" id="wrongBackBtn">← 返回首页</button>
      <h2 style="margin:0">我的错题</h2>
    </div>
    <div id="wrongList" class="card"></div>
  </section>
</div>

<div id="tongueModal" class="tongue-modal">
  <div class="modal-card">
    <div id="modalLabel" class="modal-label"></div>
    <button class="modal-close" id="closeTongue">×</button>
    <div class="tongue-layout">
      <div>
        <img id="tongueImage" alt="舌象">
        <div class="mini" style="margin-top:8px">请先观察照片，再填写舌色、舌形、舌苔。提交后才公布舌象答案。</div>
      </div>
      <div class="tongue-form">
        <h3>判断舌象</h3>
        <div><label>舌色</label><input id="tongueColorInput" placeholder="例如：淡红、红、淡白、紫暗"></div>
        <div style="margin-top:10px"><label>舌形</label><input id="tongueShapeInput" placeholder="例如：胖大、齿痕、裂纹、瘦薄"></div>
        <div style="margin-top:10px"><label>舌苔</label><input id="tongueCoatInput" placeholder="例如：薄白、黄腻、白腻、少苔"></div>
        <div class="action-row" style="margin-top:14px">
          <button class="btn btn-primary" id="submitTongueBtn">提交舌象判断</button>
        </div>
        <div id="tongueFeedback" style="margin-top:14px"></div>
      </div>
    </div>
  </div>
</div>

<script>
const LEVELS = {
  seed: {label:'🌱 入门训练', desc:'适合刚开始学习辨证的同学'},
  comprehensive: {label:'🌿 综合训练', desc:'适合已经掌握基本证候，需要综合四诊信息的同学'},
  clinical: {label:'🌳 临床思维', desc:'适合希望挑战完整真实病例的同学'}
};

const CASE_META = {
  "basic-001": {level:"seed", imageType:"参考图", titleFallback:"咳嗽案（风热犯肺津伤）"},
  "basic-002": {level:"comprehensive", imageType:"参考图", titleFallback:"肺痈案（痰热壅肺）"},
  "basic-003": {level:"comprehensive", imageType:"参考图", titleFallback:"哮病案（痰热壅肺）"},
  "basic-004": {level:"comprehensive", imageType:"参考图", titleFallback:"感冒案（暑湿客表，脾胃失和）", source:"《名医医案评选》"},
  "inter-002": {level:"comprehensive", imageType:"参考图", titleFallback:"胃脘痛案"},
  "inter-003": {level:"clinical", imageType:"参考图", titleFallback:"癫痫 / 痫病案（赵建军案）", source:"《中医临床带教经典医案》· 赵建军案"},
  "inter-004": {level:"clinical", imageType:"原始病例照片", titleFallback:"顽固性嗳气案", source:"中国中医药临床案例成果库"},
  "inter-005": {level:"comprehensive", imageType:"原始病例照片", titleFallback:"绝经前后诸证案", source:"中国中医药临床案例成果库"},
  "inter-006": {level:"clinical", imageType:"原始病例照片", titleFallback:"湿疮案", source:"中国中医药临床案例成果库"},
  "adv-001": {level:"clinical", imageType:"参考图", titleFallback:"胃脘痛 / 便秘案", source:"小红书博主“天蓝海蓝”"},
  "adv-002": {level:"clinical", imageType:"原始病例照片", titleFallback:"真心痛案", source:"《中医望诊与舌诊彩色图解》"},
  "adv-003": {level:"comprehensive", imageType:"原始病例照片", titleFallback:"胸痹案", source:"《中医望诊与舌诊彩色图解》"},
  "adv-004": {level:"clinical", imageType:"原始病例照片", titleFallback:"心悸案（王某）", source:"《中医望诊与舌诊彩色图解》"},
  "adv-005": {level:"clinical", imageType:"原始病例照片", titleFallback:"心悸案（李某）", source:"中国中医药临床案例成果库"},
  "adv-006": {level:"clinical", imageType:"原始病例照片", titleFallback:"黑毛舌案", source:"PubMed"}
};

let allCases = [];
let currentCase = null;
let currentLevel = 'seed';
let lastResult = null;
let currentTongueSource = null;
let tongueSubmitted = false;
let discovered = new Set();
let selectedIndex = 0;

const $ = id => document.getElementById(id);
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function get(obj, keys, fallback=''){
  for(const k of keys){
    if(obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
  }
  return fallback;
}
function toText(v){
  if(v==null) return '';
  if(typeof v==='string' || typeof v==='number') return String(v);
  if(Array.isArray(v)) return v.map(toText).filter(Boolean).join('；');
  if(typeof v==='object'){
    return Object.entries(v).map(([k,val]) => `${k}：${toText(val)}`).join('；');
  }
  return '';
}
function flattenStrings(v, out=[]){
  if(v==null) return out;
  if(typeof v==='string'){ out.push(v); return out; }
  if(Array.isArray(v)){ v.forEach(x=>flattenStrings(x,out)); return out; }
  if(typeof v==='object'){ Object.values(v).forEach(x=>flattenStrings(x,out)); }
  return out;
}
function guessImagePaths(c){
  const found = [];
  const re = /(?:tongue|舌|images?|img|photo|picture|image)[^"\s]*\.(?:jpg|jpeg|png|webp)/ig;
  flattenStrings(c).forEach(s=>{
    const m = s.match(re);
    if(m) m.forEach(x=>found.push(x));
    if(/\.(jpg|jpeg|png|webp)(\?.*)?$/i.test(s)) found.push(s);
  });
  const id = c.id;
  const candidates = [
    `tongue/${id}.jpg`,`tongue/${id}.jpeg`,`tongue/${id}.png`,`tongue/${id}.webp`,
    `tongue/${id}-1.jpg`,`tongue/${id}-01.jpg`
  ];
  [...found,...candidates].forEach(x=>{ if(!found.includes(x)) found.push(x); });
  return [...new Set(found)];
}
function normalizeCase(c){
  const id = get(c,['id','caseId']);
  const meta = CASE_META[id] || {};
  const title = get(c,['title','name','caseTitle'],meta.titleFallback || id);
  const chief = get(c,['chiefComplaint','主诉','chief_complaint']);
  const inspection = get(c,['inspection','望诊','inspectionData']);
  const auscultation = get(c,['auscultation','闻诊','wen']);
  const pulse = get(c,['pulse','脉象','palpation']);
  const inquiry = get(c,['inquiry','问诊','questions']);
  const history = get(c,['history','现病史','presentHistory']);
  const answer = get(c,['correctAnswer','answer','diagnosis','correct']);
  const analysis = get(c,['fullAnalysis','analysis','解析']);
  const treatment = get(c,['treatment','治法']);
  const prescription = get(c,['prescription','方药','formula']);
  const otherCheck = get(c,['otherCheck','other','辅助检查']);
  return {...c,id,title,chief,inspection,auscultation,pulse,inquiry,history,answer,analysis,treatment,prescription,otherCheck,meta,imagePaths:guessImagePaths(c)};
}

function answerPieces(c){
  const a = c.answer;
  let disease='', syndrome='';
  if(typeof a==='string'){
    syndrome=a;
  } else if(a && typeof a==='object'){
    disease=get(a,['disease','病名','病证','name']);
    syndrome=get(a,['syndrome','pattern','证型','证候','zheng']);
  }
  if(!disease) disease=get(c,['disease','病名','病证']);
  if(!syndrome) syndrome=get(c,['syndrome','pattern','证型','证候']);
  return {disease:String(disease||''),syndrome:String(syndrome||'')};
}

function buildQuestionArray(c){
  if(Array.isArray(c.inquiry)) return c.inquiry.map(x=>{
    if(typeof x==='string') return {q:x,a:''};
    return {q:get(x,['question','q','问题']),a:get(x,['answer','a','result','答案'])};
  }).filter(x=>x.q);
  if(c.inquiry && typeof c.inquiry==='object'){
    return Object.entries(c.inquiry).map(([q,a])=>({q,a:toText(a)}));
  }
  return [];
}

function getTongueText(c){
  const direct = get(c,['tongue','tongueDescription','舌象','tongueText']);
  if(direct) return toText(direct);
  return toText(c.inspection);
}
function splitTongue(c){
  const t = getTongueText(c);
  const explicit = typeof c.tongue === 'object' ? c.tongue : {};
  const color = get(explicit,['color','舌色','tongueColor']);
  const shape = get(explicit,['shape','舌形','tongueShape']);
  const coat = get(explicit,['coat','舌苔','tongueCoat']);
  if(color || shape || coat) return {color:toText(color),shape:toText(shape),coat:toText(coat),raw:t};
  return {color:'',shape:'',coat:'',raw:t};
}

const COLOR_WORDS=['淡白','淡红','红','绛','暗红','紫暗','青紫','青','舌质红','舌质淡红','舌质淡白'];
const SHAPE_WORDS=['胖大','胖','瘦薄','瘦','齿痕','裂纹','裂','点刺','老舌','嫩舌'];
const COAT_WORDS=['薄白','白腻','黄腻','黄厚腻','黄苔','白苔','薄苔','厚苔','少苔','无苔','剥苔','花剥','灰黑','黑苔','厚腻'];

function extractMatchingWords(text, list){
  const hits=[];
  list.forEach(w=>{ if(text.includes(w)) hits.push(w); });
  return [...new Set(hits)];
}
function tongueExpected(c){
  const t=splitTongue(c);
  const raw=t.raw;
  return {
    color:t.color || extractMatchingWords(raw,COLOR_WORDS).slice(0,3).join('、'),
    shape:t.shape || extractMatchingWords(raw,SHAPE_WORDS).slice(0,4).join('、'),
    coat:t.coat || extractMatchingWords(raw,COAT_WORDS).slice(0,4).join('、'),
    raw
  };
}
function compareTongueField(input, expected, words){
  const i=(input||'').trim();
  if(!i) return false;
  if(expected){
    const exWords=extractMatchingWords(expected,words);
    if(exWords.some(w=>i.includes(w))) return true;
    const normalized=i.replace(/\s/g,'');
    return normalized===String(expected).replace(/\s/g,'');
  }
  return false;
}
function tongueFeedback(c, form){
  const exp=tongueExpected(c);
  const rows=[
    ['舌色',form.color,exp.color,COLOR_WORDS],
    ['舌形',form.shape,exp.shape,SHAPE_WORDS],
    ['舌苔',form.coat,exp.coat,COAT_WORDS]
  ];
  return rows.map(([label,input,expected,words])=>{
    const ok=compareTongueField(input,expected,words);
    return {label,input,expected:expected||'原病例舌象描述中未能结构化拆分'};
  }).map((r,i)=>{
    const ok=compareTongueField(r.input,r.expected,rows[i][3]);
    return {...r,ok};
  });
}

function renderLevelBadge(level){ return `${LEVELS[level].label}`; }

function chooseCase(){
  const pool=allCases.filter(c=>c.meta.level===currentLevel);
  if(!pool.length) return null;
  selectedIndex=Math.floor(Math.random()*pool.length);
  return pool[selectedIndex];
}

function resetGame(c){
  currentCase=c;
  discovered=new Set();
  tongueSubmitted=false;
  currentTongueSource=null;
  $('levelBadge').textContent=renderLevelBadge(currentLevel);
  $('caseTitle').textContent=c.id;
  $('gameTitle').textContent=c.title;
  $('caseIndex').textContent=`共 ${allCases.filter(x=>x.meta.level===currentLevel).length} 例`;
  $('chiefComplaint').textContent=c.chief || '暂无主诉';
  $('clueArea').innerHTML='';
  $('questionArea').innerHTML='';
  document.querySelectorAll('.diag-btn').forEach(b=>b.classList.remove('used'));
  $('diseaseInput').value=''; $('syndromeInput').value=''; $('reasonInput').value='';
  showPage('gamePage');
}

function addClue(tag,html){
  const div=document.createElement('div');
  div.className='clue';
  div.innerHTML=`<span class="tag">${escapeHtml(tag)}</span>${html}`;
  $('clueArea').appendChild(div);
}

function nonTongueInspection(c){
  const text=toText(c.inspection);
  if(!text) return '暂无望诊文字资料。';
  let result=text;
  const tonguePatterns=[
    /舌(?:象|质|色|形|苔|体|面)[^。；\n]*/g,
    /舌[^。；\n]*(?:苔)[^。；\n]*/g
  ];
  tonguePatterns.forEach(re=>{result=result.replace(re,'');});
  return result.trim() || '本病例主要以舌象资料为主。';
}

function openTongueModal(){
  const c=currentCase;
  const paths=c.imagePaths||[];
  if(!paths.length){
    $('tongueImage').src='';
    $('tongueImage').alt='未找到舌象图片路径';
  }else{
    $('tongueImage').src=paths[0];
    $('tongueImage').onerror=()=>{
      const idx=paths.indexOf($('tongueImage').src.replace(location.origin+'/',''));
      const next=paths[idx+1];
      if(next) $('tongueImage').src=next;
      else $('tongueImage').alt='舌象图片加载失败，请检查当前仓库中的图片路径';
    };
  }
  $('modalLabel').textContent=c.meta.imageType || '舌象图片';
  $('tongueColorInput').value=''; $('tongueShapeInput').value=''; $('tongueCoatInput').value='';
  $('tongueFeedback').innerHTML=tongueSubmitted?'<div class="mini">已提交过本病例舌象判断。</div>':'';
  $('tongueModal').classList.add('show');
}

function handleDiag(type){
  if(!currentCase) return;
  if(type==='望诊'){
    if(discovered.has('望诊')) return;
    discovered.add('望诊');
    document.querySelector('[data-diag="望诊"]').classList.add('used');
    addClue('望诊',`<div><div>${escapeHtml(nonTongueInspection(currentCase))}</div>
      <div class="mini" style="margin-top:8px">👅 舌象判断已进入观察状态：请在舌象照片旁填写舌色、舌形、舌苔。未提交前不会公布舌象答案。</div></div>`);
    openTongueModal();
    return;
  }
  if(type==='闻诊'){
    if(discovered.has('闻诊')) return;
    discovered.add('闻诊'); document.querySelector('[data-diag="闻诊"]').classList.add('used');
    addClue('闻诊',escapeHtml(toText(currentCase.auscultation)||'暂无闻诊资料。')); return;
  }
  if(type==='切诊'){
    if(discovered.has('切诊')) return;
    discovered.add('切诊'); document.querySelector('[data-diag="切诊"]').classList.add('used');
    addClue('切诊',escapeHtml(toText(currentCase.pulse)||'暂无脉诊资料。')); return;
  }
  if(type==='问诊'){
    const qs=buildQuestionArray(currentCase);
    if(!qs.length){
      if(discovered.has('问诊')) return;
      discovered.add('问诊'); document.querySelector('[data-diag="问诊"]').classList.add('used');
      addClue('问诊',escapeHtml(toText(currentCase.inquiry)||'暂无问诊资料。'));
      return;
    }
    const idx=qs.length?Math.min(selectedIndex,qs.length-1):0;
    const q=qs[idx];
    $('questionArea').innerHTML=`<div class="card" style="margin:0;background:#faf5ef">
      <label>你想问患者什么？</label>
      <input id="askInput" placeholder="请输入你的问题">
      <button class="btn btn-primary" id="askBtn" style="margin-top:8px">询问</button>
      <div id="askHint" class="mini" style="margin-top:6px">问诊结果会从病例原始问诊资料中匹配。</div>
    </div>`;
    $('askBtn').onclick=()=>{
      const qtext=$('askInput').value.trim();
      if(!qtext) return;
      const matched=qs.find(x=> qtext.includes(x.q) || x.q.includes(qtext) || x.q.split(/[，、。；：]/).some(k=>k&&qtext.includes(k)));
      addClue('问诊',matched?escapeHtml(matched.a||'患者未作明确回答。'):'未匹配到该病例预设问诊答案，可继续从其他方向询问。');
      $('askInput').value='';
    };
  }
}

function scoreReason(c,reason){
  const {disease,syndrome}=answerPieces(c);
  const source=[disease,syndrome,toText(c.analysis),toText(c.treatment)].join(' ');
  const keywords=[...new Set(
    (source.match(/[\u4e00-\u9fa5]{2,8}/g)||[])
      .filter(x=>x.length>=2)
      .slice(0,30)
  )];
  let hits=0;
  keywords.slice(0,15).forEach(k=>{if(reason.includes(k)) hits++;});
  return Math.min(20,Math.round(hits/Math.max(1,Math.min(6,keywords.length))*20));
}

function normalizeAnswerText(s){ return String(s||'').replace(/\s/g,'').replace(/[。！？、，,.]/g,'').toLowerCase(); }
function exactish(user,correct){
  const u=normalizeAnswerText(user), c=normalizeAnswerText(correct);
  return !!u && !!c && (u===c || u.includes(c) || c.includes(u));
}
function buildResult(c){
  const a=answerPieces(c);
  const dOk=exactish($('diseaseInput').value,a.disease);
  const sOk=exactish($('syndromeInput').value,a.syndrome);
  const reasonPts=scoreReason(c,$('reasonInput').value);
  const hasTongue=!!(c.imagePaths.length || tongueExpected(c).raw);
  let tonguePts=0, tongueRows=[];
  if(hasTongue){
    if(!tongueSubmitted){
      tonguePts=-1;
    }else{
      const tForm={color:$('tongueColorInput').value,shape:$('tongueShapeInput').value,coat:$('tongueCoatInput').value};
      tongueRows=tongueFeedback(c,tForm);
      tonguePts=Math.round(tongueRows.filter(r=>r.ok).length/3*20);
    }
  }
  const base=hasTongue?80:100;
  const raw = (dOk?40:0)+(sOk?40:0)+reasonPts;
  const score=hasTongue?(Math.round((raw/100)*80)+tonguePts):raw;
  const fullyCorrect=dOk&&sOk&&reasonPts>=10&&(!hasTongue||tonguePts>=14);
  return {dOk,sOk,reasonPts,tonguePts,tongueRows,score,fullyCorrect};
}

function submitAnswer(){
  if(!currentCase) return;
  const hasTongue=!!(currentCase.imagePaths.length || tongueExpected(currentCase).raw);
  if(hasTongue && !tongueSubmitted){
    alert('请先点击“望诊”并提交舌色、舌形、舌苔判断，再提交最终答案。');
    return;
  }
  const result=buildResult(currentCase);
  lastResult={...result,caseId:currentCase.id,disease:$('diseaseInput').value.trim(),syndrome:$('syndromeInput').value.trim(),reason:$('reasonInput').value.trim(),time:new Date().toISOString()};
  saveWrongIfNeeded(lastResult);
  renderResult();
  showPage('resultPage');
}

function renderResult(){
  $('resultLevel').textContent=renderLevelBadge(currentCase.meta.level);
  $('scoreText').textContent=`总评：${lastResult.score}/100`;
  $('scoreGrid').innerHTML=`
    <div class="score-box">病名判断<b>${lastResult.dOk?'✅ 正确':'❌ 不正确'}</b></div>
    <div class="score-box">证型判断<b>${lastResult.sOk?'✅ 正确':'❌ 不正确'}</b></div>
    <div class="score-box">辨证依据<b>${lastResult.reasonPts}/20</b></div>
    <div class="score-box">舌诊判断<b>${lastResult.tonguePts<0?'未评分':lastResult.tonguePts+'/20'}</b></div>`;
  $('resultFeedback').innerHTML=lastResult.fullyCorrect
    ? `<div class="success-card card" style="margin:0">✅ 这次判断已达到当前练习的正确标准。点击“显示完整病例”查看标准答案、完整四诊资料与病例来源。</div>`
    : `<div class="error-card card" style="margin:0"><b>本次需要复习。</b><br>你的辨证依据已经被记录到“我的错题”中。请查看完整病例，理解主要证据后再重新挑战。</div>`;
}

function formatSection(title, value){
  if(!value) return '';
  return `<div class="case-section"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(toText(value))}</p></div>`;
}

function fullCaseHtml(c){
  const a=answerPieces(c);
  const t=tongueExpected(c);
  const source=c.meta.source||'原病例出处待补充';
  return `
    <div class="chief">${escapeHtml(c.chief||'')}</div>
    ${formatSection('基础信息',get(c,['patient','基础信息','patientInfo']))}
    ${formatSection('现病史',c.history)}
    ${formatSection('望诊',c.inspection)}
    ${formatSection('闻诊',c.auscultation)}
    ${formatSection('问诊',c.inquiry)}
    ${formatSection('切诊 / 脉象',c.pulse)}
    ${formatSection('其他检查',c.otherCheck)}
    <div class="case-section"><h3>标准答案</h3>
      <p><b>病名：</b>${escapeHtml(a.disease||'未单独提供')}</p>
      <p><b>证型：</b>${escapeHtml(a.syndrome||'未单独提供')}</p>
      ${formatSection('治法',c.treatment)}
      ${formatSection('方药',c.prescription)}
    </div>
    ${formatSection('病例分析',c.analysis)}
    <div class="source-box">
      <div class="source-title">📚 病例来源</div>
      <div style="margin-top:6px">${escapeHtml(source)}</div>
      <div class="mini" style="margin-top:8px">你可以根据来源名称自行查找原文，进一步查看二诊、三诊或后续诊疗经过。本站完整病例展示仅作为学习整理。</div>
    </div>
    <div class="source-box" style="margin-top:12px">
      <b>👅 舌象图片说明：</b>${escapeHtml(c.meta.imageType||'未标注')}。
      ${t.raw?`<div class="mini" style="margin-top:6px">原病例舌象描述：${escapeHtml(t.raw)}</div>`:''}
    </div>`;
}

function showFullCase(){
  $('fullLevel').textContent=renderLevelBadge(currentCase.meta.level);
  $('fullTitle').textContent=currentCase.title;
  $('fullCaseId').textContent=currentCase.id;
  $('fullCaseContent').innerHTML=fullCaseHtml(currentCase);
  showPage('fullCasePage');
}

function getWrong(){ return JSON.parse(localStorage.getItem('tcmWrongCases')||'[]'); }
function setWrong(arr){ localStorage.setItem('tcmWrongCases',JSON.stringify(arr)); updateStats(); }
function saveWrongIfNeeded(r){
  const wrong=getWrong();
  const existing=wrong.find(x=>x.caseId===r.caseId);
  if(r.fullyCorrect){
    if(existing){ setWrong(wrong.filter(x=>x.caseId!==r.caseId)); }
    return;
  }
  const item={
    caseId:r.caseId,time:r.time,disease:r.disease,syndrome:r.syndrome,reason:r.reason,
    score:r.score
  };
  if(existing) Object.assign(existing,item); else wrong.unshift(item);
  setWrong(wrong.slice(0,200));
}
function updateStats(){
  const wrong=getWrong();
  $('wrongCount').textContent=wrong.length;
  const attempts=Number(localStorage.getItem('tcmAttempts')||0);
  const correct=Number(localStorage.getItem('tcmCorrect')||0);
  $('statsBox').textContent=`已完成 ${attempts} 次训练；当前错题 ${wrong.length} 例；整体正确率 ${attempts?Math.round(correct/attempts*100):0}%。`;
}
function renderWrong(){
  const wrong=getWrong();
  if(!wrong.length){ $('wrongList').innerHTML='<div class="empty">🎉 目前没有错题。</div>'; return; }
  $('wrongList').innerHTML=wrong.map(item=>{
    const c=allCases.find(x=>x.id===item.caseId);
    if(!c) return '';
    return `<div class="wrong-item">
      <div class="wrong-time">${new Date(item.time).toLocaleDateString('zh-CN')} · ${escapeHtml(c.meta.level?LEVELS[c.meta.level].label:'')}</div>
      <h3>${escapeHtml(c.title)}</h3>
      <div><b>主诉：</b>${escapeHtml(c.chief||'')}</div>
      <div><b>我的答案：</b>${escapeHtml(item.disease||'')}；${escapeHtml(item.syndrome||'')}</div>
      <div class="wrong-answer"><b>错误原因 / 我的辨证依据：</b>${escapeHtml(item.reason||'未填写')}</div>
      <div class="mini">本次得分：${item.score}/100。只有重新练习并达到正确标准，该案例才会自动从错题中移除。</div>
      <div class="action-row" style="margin-top:10px">
        <button class="btn btn-primary retry-btn" data-id="${escapeHtml(c.id)}">重新挑战</button>
        <button class="btn btn-secondary parse-btn" data-id="${escapeHtml(c.id)}">查看解析</button>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.retry-btn').forEach(b=>b.onclick=()=>{
    const c=allCases.find(x=>x.id===b.dataset.id); currentLevel=c.meta.level; resetGame(c);
  });
  document.querySelectorAll('.parse-btn').forEach(b=>b.onclick=()=>{
    const c=allCases.find(x=>x.id===b.dataset.id); currentCase=c; showFullCase();
  });
}

function attachEvents(){
  document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.level').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected'); currentLevel=b.dataset.level;
  });
  $('startBtn').onclick=()=>{
    const c=chooseCase();
    if(!c){ alert('当前训练阶段暂无病例。'); return; }
    resetGame(c);
  };
  $('wrongBtn').onclick=()=>{renderWrong();showPage('wrongPage');};
  $('backHomeBtn').onclick=()=>{updateStats();showPage('homePage');};
  $('resultHomeBtn').onclick=()=>{updateStats();showPage('homePage');};
  $('showAnswerBtn').onclick=showFullCase;
  $('retryNowBtn').onclick=()=>resetGame(currentCase);
  $('fullRetryBtn').onclick=()=>resetGame(currentCase);
  $('fullBackBtn').onclick=()=>showPage('resultPage');
  $('wrongBackBtn').onclick=()=>showPage('homePage');
  document.querySelectorAll('.diag-btn').forEach(b=>b.onclick=()=>handleDiag(b.dataset.diag));
  $('closeTongue').onclick=()=>$('tongueModal').classList.remove('show');
  $('tongueModal').onclick=e=>{if(e.target.id==='tongueModal') $('tongueModal').classList.remove('show');};
  $('submitTongueBtn').onclick=()=>{
    const form={color:$('tongueColorInput').value,shape:$('tongueShapeInput').value,coat:$('tongueCoatInput').value};
    const rows=tongueFeedback(currentCase,form);
    tongueSubmitted=true;
    $('tongueFeedback').innerHTML=rows.map(r=>`<div>${escapeHtml(r.label)}：${r.ok?'✅':'❌'} <span class="mini">标准：${escapeHtml(r.expected||'暂无')}</span></div>`).join('');
    addClue('舌诊',
      `<div><b>标准舌象：</b>
      ${rows.map(r=>`${escapeHtml(r.label)}：${escapeHtml(r.expected||'暂无')}`).join('；')}
      </div>
      <div style="margin-top:6px"><b>你的判断：</b>
      ${rows.map(r=>`${escapeHtml(r.label)}${r.ok?'✅':'❌'}`).join('　')}
      </div>`);
    $('tongueModal').classList.remove('show');
  };
  $('submitBtn').onclick=()=>{
    localStorage.setItem('tcmAttempts',String(Number(localStorage.getItem('tcmAttempts')||0)+1));
    submitAnswer();
    if(lastResult && lastResult.fullyCorrect){
      localStorage.setItem('tcmCorrect',String(Number(localStorage.getItem('tcmCorrect')||0)+1));
    }
  };
}

async function init(){
  try{
    const raw=await fetch('cases.json',{cache:'no-store'}).then(r=>r.json());
    const arr=Array.isArray(raw)?raw:(raw.cases||raw.data||[]);
    allCases=arr.map(normalizeCase).filter(c=>c.id);
    if(!allCases.length) throw new Error('cases.json 中没有读取到病例');
    attachEvents(); updateStats();
    const first=document.querySelector('.level[data-level="seed"]'); first.classList.add('selected');
  }catch(err){
    document.body.innerHTML=`<div style="padding:30px;font-family:sans-serif">加载病例失败：${escapeHtml(err.message)}。请确认 cases.json 与 index.html 位于同一目录。</div>`;
  }
}
init();
</script>
