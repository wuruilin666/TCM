name: ui-finish

# 一次性任务：落地首页视觉收尾 + 自托管中文衬线字体子集。
# 只在自身文件变化时触发，避免机器人提交再次触发本流程。
on:
  push:
    paths:
      - '.github/workflows/ui-finish.yml'

permissions:
  contents: write

jobs:
  ui-finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 还原 css/main.css 到稳定基线并清理临时文件
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 85dcb62620338be0de598358ab285e142c616822 -- css/main.css
          git rm -f --ignore-unmatch _probe.txt

      - name: 应用首页视觉收尾
        run: python3 .github/scripts/ui_css_patch.py

      - name: 安装字体处理工具
        run: pip install --quiet fonttools brotli

      - name: 生成思源宋体子集
        run: python3 .github/scripts/build_font.py

      - name: 提交
        run: |
          git add -A
          git status --short
          git commit -m "UI 收尾：主标题层级 / 中文衬线字体自托管 / 次级导航可点性 / 移除装饰圆环"
          git push origin HEAD:main
