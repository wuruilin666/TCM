name: home-trim

# 一次性任务：删除首页底部四诊展示模块，让视觉中心集中到标题与「开始接诊」。
# 只在自身文件变化时触发，避免机器人提交再次触发本流程。
on:
  push:
    paths:
      - '.github/workflows/home-trim.yml'

permissions:
  contents: write

jobs:
  home-trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 应用首页精简
        run: python3 .github/scripts/trim_home.py

      - name: 校验
        run: |
          set -e
          if grep -rn 'four-diagnosis-hero' js/ css/ index.html; then
            echo '四诊模块仍有残留'
            exit 1
          fi
          echo '四诊模块已移除'
          grep -q 'onclick="startChallenge()"' js/app.js
          grep -q 'onclick="showAbout(); return false;"' js/app.js
          grep -q 'onclick="openCaseBank(); return false;"' js/app.js
          echo '按钮 onclick 保持不变'
          grep -q '^.four-diagnosis {' css/main.css
          echo '接诊页四诊样式保留'

      - name: 提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m '首页精简：移除底部四诊展示模块，视觉中心集中到标题与开始接诊'
          git push origin HEAD:main
